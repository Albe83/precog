# Default values for the precog chart.

replicaCount: 1

image:
  # Published weight-free images: ghcr.io/albe83/precog-api. Or build locally
  # and load into the cluster (precog-api:local).
  repository: precog-api
  tag: local
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}

# Model weights are downloaded into a mounted volume at startup (not baked in
# the image). Defaults are conservative: an ephemeral emptyDir and a single
# replica, so no StorageClass or RWX support is assumed.
modelCache:
  modelId: google/timesfm-3.0-pytorch
  revision: 43046b85ec22d584a13f8098c2ed39c889e129c2
  # auto: download if missing; always: force download; never: expect pre-seeded.
  preload: auto
  # Remove cached snapshots other than `revision` after download (needs a pinned
  # revision; frees disk when rotating model revisions).
  pruneOldRevisions: false
  mountPath: /opt/precog/hf
  # Name of an existing Secret holding the Hugging Face token (key: hf-token).
  hfTokenSecret: ""
  persistence:
    # false -> emptyDir (ephemeral, re-downloads on restart)
    # true  -> PersistentVolumeClaim (created unless existingClaim is set)
    # existingClaim alone also enables persistence (no chart-managed PVC).
    enabled: false
    existingClaim: ""
    # ReadWriteMany by default so scaling up reuses the same volume instead of
    # recreating it. Set ReadWriteOnce if your StorageClass does not support RWX.
    accessModes:
      - ReadWriteMany
    size: 5Gi
    storageClass: ""

  # Autoscaling above one replica shares the cache: with the default ephemeral
  # emptyDir each pod downloads its own copy. Set to true to accept that.
  allowEphemeralWithHpa: false

  # Run the download in an initContainer before the app container, so the app
  # container only reads from the cache (and gets PRECOG_PRELOAD=never).
  # With a shared cache, concurrent downloads are serialized by the Hugging Face
  # cache lock: the first pod downloads, the others wait and reuse.
  downloadInitContainer:
    enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # Pre-populate the cache with a one-shot Job (post-install/post-upgrade hook).
  # Requires a persistent cache: set persistence.enabled=true or existingClaim.
  # Handy to download once before scaling, especially with preload=never.
  downloadJob:
    enabled: false
    backoffLimit: 3
    ttlSecondsAfterFinished: 600
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

# Runtime configuration, rendered into a ConfigMap.
config:
  engine: timesfm3
  device: cpu
  torchThreads: 0
  maxConcurrency: 1
  maxHorizon: 1024
  maxContext: 16384
  maxSeries: 64
  enableDocs: true
  # Optional bearer token. Leave empty to disable auth.
  # Set either apiKey (chart-managed Secret) or existingSecret, not both.
  apiKey: ""
  # Reference an existing Secret instead of putting the token in values.
  existingSecret: ""
  existingSecretKey: "api-key"

resources:
  requests:
    cpu: "1"
    memory: 3Gi
  limits:
    cpu: "4"
    memory: 8Gi

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# Allows a cold start (download + model load) before liveness kicks in.
startupProbe:
  periodSeconds: 10
  failureThreshold: 60

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

serviceAccount:
  create: true
  name: ""

# Optional MCP server deployment (talks to the API over HTTP, no model weights).
mcp:
  enabled: false
  image:
    # Published: ghcr.io/albe83/precog-mcp.
    repository: precog-mcp
    tag: local
    pullPolicy: IfNotPresent
  # Defaults to the API Service in this release when empty.
  apiUrl: ""
  # Allowed Host headers for the MCP HTTP transport (comma-separated), or "*" to
  # disable DNS-rebinding protection. Set it when a gateway reaches the service
  # by DNS name (e.g. "precog-mcp.<ns>.svc:80,mcp-cortana.gewiss.ai").
  allowedHosts: ""
  service:
    port: 80
    targetPort: 8765
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  terminationGracePeriodSeconds: 30

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Escape hatches applied to the API, MCP, download initContainer and Job.
# Example: mount a corporate CA and point Python at it:
#   extraVolumes:
#     - name: corp-ca
#       secret: { secretName: corp-ca }
#   extraVolumeMounts:
#     - name: corp-ca
#       mountPath: /etc/ssl/certs/corp-ca.crt
#       subPath: ca.crt
#   extraEnv:
#     - name: SSL_CERT_FILE
#       value: /etc/ssl/certs/corp-ca.crt
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

imagePullSecrets: []
podLabels: {}
priorityClassName: ""
topologySpreadConstraints: []

# API pod termination grace period; keep it above PRECOG_REQUEST_TIMEOUT_S
# (config.requestTimeout, default 300s) so in-flight forecasts complete.
terminationGracePeriodSeconds: 360

# Chart connectivity tests (`helm test precog`): the API `/readyz` and, when
# mcp.enabled=true, the MCP `/metrics` endpoint. GitOps tools that do not run
# Helm test hooks (for example Argo CD) should set this to false to avoid
# rendering the test Pods.
tests:
  enabled: true

# Prometheus scraping for the API and MCP `/metrics` endpoints (the selector
# matches both Services when mcp.enabled=true).
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    # Extra labels for the ServiceMonitor (e.g. your Prometheus release label).
    labels: {}
