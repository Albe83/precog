# Default values for the precog chart.

replicaCount: 1

image:
  # Build the image locally and load it into the cluster. Nothing is published.
  repository: precog-api
  tag: local
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# Model weights are downloaded into a mounted volume at startup (not baked in
# the image). Defaults are conservative: an ephemeral emptyDir and a single
# replica, so no StorageClass or RWX support is assumed.
modelCache:
  modelId: google/timesfm-3.0-pytorch
  revision: 43046b85ec22d584a13f8098c2ed39c889e129c2
  # auto: download if missing; always: force download; never: expect pre-seeded.
  preload: auto
  mountPath: /opt/precog/hf
  # Name of an existing Secret holding the Hugging Face token (key: hf-token).
  hfTokenSecret: ""
  persistence:
    # false -> emptyDir (ephemeral, re-downloads on restart)
    # true  -> PersistentVolumeClaim (created unless existingClaim is set)
    enabled: false
    existingClaim: ""
    # ReadWriteMany by default so scaling up reuses the same volume instead of
    # recreating it. Set ReadWriteOnce if your StorageClass does not support RWX.
    accessModes:
      - ReadWriteMany
    size: 5Gi
    storageClass: ""

  # Run the download in an initContainer before the app container, so the app
  # container only reads from the cache (and gets PRECOG_PRELOAD=never).
  # With a shared cache, concurrent downloads are serialized by the Hugging Face
  # cache lock: the first pod downloads, the others wait and reuse.
  downloadInitContainer:
    enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # Pre-populate the cache with a one-shot Job (post-install/post-upgrade hook).
  # Requires a persistent cache: set persistence.enabled=true or existingClaim.
  # Handy to download once before scaling, especially with preload=never.
  downloadJob:
    enabled: false
    backoffLimit: 3
    ttlSecondsAfterFinished: 600
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

# Runtime configuration, rendered into a ConfigMap.
config:
  engine: timesfm3
  device: cpu
  torchThreads: 0
  maxConcurrency: 1
  maxHorizon: 1024
  maxContext: 16384
  maxSeries: 64
  enableDocs: true
  # Optional bearer token. Leave empty to disable auth.
  apiKey: ""

resources:
  requests:
    cpu: "1"
    memory: 3Gi
  limits:
    cpu: "4"
    memory: 8Gi

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# Allows a cold start (download + model load) before liveness kicks in.
startupProbe:
  periodSeconds: 10
  failureThreshold: 60

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

serviceAccount:
  create: true
  name: ""

# Optional MCP server deployment (talks to the API over HTTP, no model weights).
mcp:
  enabled: false
  image:
    repository: precog-mcp
    tag: local
    pullPolicy: IfNotPresent
  # Defaults to the API Service in this release when empty.
  apiUrl: ""
  service:
    port: 80
    targetPort: 8765
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
