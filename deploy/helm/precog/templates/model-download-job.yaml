{{- if .Values.modelCache.downloadJob.enabled }}
{{- if ne (include "precog.modelCache.persistenceEnabled" .) "true" }}
{{- fail "modelCache.downloadJob.enabled requires modelCache.persistence.enabled=true or modelCache.persistence.existingClaim" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "precog.fullname" . }}-model-download
  labels:
    {{- include "precog.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.modelCache.downloadJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.modelCache.downloadJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "precog.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "precog.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: download-model
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["precog-download-model"]
          env:
            - name: PRECOG_MODEL_ID
              value: {{ .Values.modelCache.modelId | quote }}
            - name: PRECOG_MODEL_REVISION
              value: {{ .Values.modelCache.revision | quote }}
            - name: PRECOG_CACHE_DIR
              value: {{ .Values.modelCache.mountPath | quote }}
            - name: PRECOG_PRELOAD
              value: always
            - name: PRECOG_PRUNE_OLD_REVISIONS
              value: {{ .Values.modelCache.pruneOldRevisions | quote }}
            {{- if .Values.modelCache.hfTokenSecret }}
            - name: PRECOG_HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.modelCache.hfTokenSecret }}
                  key: hf-token
            {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.modelCache.mountPath }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.modelCache.downloadJob.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ include "precog.modelCache.claimName" . }}
        - name: tmp
          emptyDir: {}
{{- end }}
