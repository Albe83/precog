{{- if and .Values.httpRoute.enabled (not .Values.httpRoute.parentRefs) }}
{{- fail "httpRoute.enabled requires httpRoute.parentRefs" }}
{{- end }}
{{- if and .Values.config.apiKey .Values.config.existingSecret }}
{{- fail "set either config.apiKey or config.existingSecret, not both" }}
{{- end }}
{{- if and .Values.autoscaling.enabled (gt (int .Values.autoscaling.maxReplicas) 1) (ne (include "precog.modelCache.persistenceEnabled" .) "true") (not .Values.modelCache.allowEphemeralWithHpa) }}
{{- fail "autoscaling with maxReplicas>1 needs a shared model cache: set modelCache.persistence.enabled=true (ReadWriteMany) or modelCache.persistence.existingClaim, or set modelCache.allowEphemeralWithHpa=true to accept a per-pod download" }}
{{- end }}
