apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "precog.fullname" . }}
  labels:
    {{- include "precog.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "precog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.config.apiKey (not .Values.config.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "precog.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "precog.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.modelCache.downloadInitContainer.enabled }}
      initContainers:
        - name: download-model
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["precog-download-model"]
          env:
            - name: PRECOG_MODEL_ID
              value: {{ .Values.modelCache.modelId | quote }}
            - name: PRECOG_MODEL_REVISION
              value: {{ .Values.modelCache.revision | quote }}
            - name: PRECOG_CACHE_DIR
              value: {{ .Values.modelCache.mountPath | quote }}
            - name: PRECOG_PRELOAD
              value: always
            - name: PRECOG_PRUNE_OLD_REVISIONS
              value: {{ .Values.modelCache.pruneOldRevisions | quote }}
            {{- if .Values.modelCache.hfTokenSecret }}
            - name: PRECOG_HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.modelCache.hfTokenSecret }}
                  key: hf-token
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.modelCache.mountPath }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.modelCache.downloadInitContainer.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "precog.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: PRECOG_MODEL_ID
              value: {{ .Values.modelCache.modelId | quote }}
            - name: PRECOG_MODEL_REVISION
              value: {{ .Values.modelCache.revision | quote }}
            - name: PRECOG_CACHE_DIR
              value: {{ .Values.modelCache.mountPath | quote }}
            - name: PRECOG_PRELOAD
              value: {{ ternary "never" .Values.modelCache.preload .Values.modelCache.downloadInitContainer.enabled | quote }}
            - name: PRECOG_PRUNE_OLD_REVISIONS
              value: {{ .Values.modelCache.pruneOldRevisions | quote }}
            {{- if or .Values.config.apiKey .Values.config.existingSecret }}
            - name: PRECOG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "precog.apiKeySecretName" . }}
                  key: {{ include "precog.apiKeySecretKey" . }}
            {{- end }}
            {{- if .Values.modelCache.hfTokenSecret }}
            - name: PRECOG_HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.modelCache.hfTokenSecret }}
                  key: hf-token
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.modelCache.mountPath }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: model-cache
          {{- if eq (include "precog.modelCache.persistenceEnabled" .) "true" }}
          persistentVolumeClaim:
            claimName: {{ include "precog.modelCache.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
