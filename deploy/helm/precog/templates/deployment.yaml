apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "precog.fullname" . }}
  labels:
    {{- include "precog.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "precog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "precog.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "precog.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.modelCache.downloadInitContainer.enabled }}
      initContainers:
        - name: download-model
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["precog-download-model"]
          env:
            - name: PRECOG_MODEL_ID
              value: {{ .Values.modelCache.modelId | quote }}
            - name: PRECOG_MODEL_REVISION
              value: {{ .Values.modelCache.revision | quote }}
            - name: PRECOG_CACHE_DIR
              value: {{ .Values.modelCache.mountPath | quote }}
            - name: PRECOG_PRELOAD
              value: always
            {{- if .Values.modelCache.hfTokenSecret }}
            - name: PRECOG_HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.modelCache.hfTokenSecret }}
                  key: hf-token
            {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.modelCache.mountPath }}
          resources:
            {{- toYaml .Values.modelCache.downloadInitContainer.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "precog.fullname" . }}
          env:
            - name: PRECOG_MODEL_ID
              value: {{ .Values.modelCache.modelId | quote }}
            - name: PRECOG_MODEL_REVISION
              value: {{ .Values.modelCache.revision | quote }}
            - name: PRECOG_CACHE_DIR
              value: {{ .Values.modelCache.mountPath | quote }}
            - name: PRECOG_PRELOAD
              value: {{ ternary "never" .Values.modelCache.preload .Values.modelCache.downloadInitContainer.enabled | quote }}
            {{- if .Values.config.apiKey }}
            - name: PRECOG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "precog.fullname" . }}
                  key: api-key
            {{- end }}
            {{- if .Values.modelCache.hfTokenSecret }}
            - name: PRECOG_HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.modelCache.hfTokenSecret }}
                  key: hf-token
            {{- end }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.modelCache.mountPath }}
      volumes:
        - name: model-cache
          {{- if .Values.modelCache.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.modelCache.existingClaim | default (include "precog.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
