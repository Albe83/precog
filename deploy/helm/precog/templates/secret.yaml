{{- if and .Values.config.apiKey .Values.config.existingSecret }}
{{- fail "set either config.apiKey or config.existingSecret, not both" }}
{{- end }}
{{- if and .Values.config.apiKey (not .Values.config.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "precog.fullname" . }}
  labels:
    {{- include "precog.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.config.apiKey | quote }}
{{- end }}
