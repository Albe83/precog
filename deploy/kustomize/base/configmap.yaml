apiVersion: v1
kind: ConfigMap
metadata:
  name: precog
data:
  PRECOG_ENGINE: timesfm3
  PRECOG_DEVICE: cpu
  PRECOG_TORCH_THREADS: "0"
  PRECOG_MAX_CONCURRENCY: "1"
  PRECOG_MAX_HORIZON: "1024"
  PRECOG_MAX_CONTEXT: "16384"
  PRECOG_MAX_SERIES: "64"
  PRECOG_ENABLE_DOCS: "true"
  PRECOG_MODEL_ID: google/timesfm-3.0-pytorch
  PRECOG_MODEL_REVISION: 43046b85ec22d584a13f8098c2ed39c889e129c2
  PRECOG_CACHE_DIR: /opt/precog/hf
  PRECOG_PRELOAD: auto
