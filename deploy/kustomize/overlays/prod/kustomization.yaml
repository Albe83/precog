apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: precog
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: precog
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 8Gi
