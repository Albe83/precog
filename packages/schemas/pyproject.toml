[project]
name = "precog-schemas"
version = "0.1.0"
description = "Shared Pydantic schemas for the Precog REST API."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precog_schemas"]
