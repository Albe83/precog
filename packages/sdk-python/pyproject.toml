[project]
name = "precog-client"
version = "0.1.0"
description = "Typed synchronous and asynchronous client for the Precog Execution API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "precog-schemas",
]

[project.urls]
Repository = "https://github.com/Albe83/precog"
Documentation = "https://github.com/Albe83/precog/blob/main/docs/sdk.md"

[project.scripts]
precog = "precog_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precog_client"]
