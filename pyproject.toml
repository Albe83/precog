[project]
name = "precog"
version = "1.3.2"
description = "TimesFM-3 as a service: REST API, MCP server and client SDK."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/mcp", "packages/schemas", "packages/sdk-python"]

[tool.uv.sources]
precog-schemas = { workspace = true }
precog-api = { workspace = true }
precog-mcp = { workspace = true }
precog-client = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "packages", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["benchmarks", "precog_api", "precog_client", "precog_mcp", "precog_schemas"]

[tool.mypy]
python_version = "3.12"
files = ["apps", "packages"]
mypy_path = ["apps/api/src", "apps/mcp/src", "packages/schemas/src", "packages/sdk-python/src"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "tools"]
markers = [
    "unit: fast tests without the real model",
    "integration: tests that load the real engine",
]
addopts = "-m 'not integration'"
