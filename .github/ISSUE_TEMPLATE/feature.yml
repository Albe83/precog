name: Feature request
description: Propose a new capability or task.
title: "[type/area] "
labels: ["type:feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem does this solve and why now?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of concrete, verifiable outcomes.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Related or blocking issues (e.g. `#12`).
    validations:
      required: false
