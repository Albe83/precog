name: publish-images

# Publishes the weight-free images to GHCR. The API image downloads the
# TimesFM-3 weights at runtime, so the image itself does not redistribute them.
# Never publish an image built with PRECOG_BAKE_WEIGHTS=true.
#
# Release artifacts are always built from the concrete release tag supplied as
# `inputs.tag`, never from the workflow event SHA. Manual dispatch must name an
# existing release tag: it cannot publish unreleased `main` as `latest`.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.0.0). Required.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: precog-api
            file: Dockerfile
            scope: api
          - name: mcp
            image: precog-mcp
            file: Dockerfile.mcp
            scope: mcp
    steps:
      - name: Resolve and validate the release tag
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            echo "::error::a concrete release tag is required; manual dispatch republishes an existing release, it does not publish unreleased main"
            exit 1
          fi

          # Must be a v-prefixed SemVer release tag. Reject branches (main),
          # raw commit SHAs and malformed refs before any build/publish.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' is not a SemVer release tag (expected vMAJOR.MINOR.PATCH[-prerelease][+build]); branches, commit SHAs and arbitrary refs are rejected"
            exit 1
          fi

          # Prove refs/tags/<tag> exists (not merely that the name resolves to a
          # commit) and resolve it, dereferencing annotated tags.
          if ! ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>/dev/null)"; then
            echo "::error::release tag 'refs/tags/$tag' does not exist in ${GITHUB_REPOSITORY}"
            exit 1
          fi
          obj_type="$(jq -r .object.type <<<"$ref")"
          obj_sha="$(jq -r .object.sha <<<"$ref")"
          case "$obj_type" in
            tag) sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${obj_sha}" --jq .object.sha)" ;;
            commit) sha="$obj_sha" ;;
            *) echo "::error::refs/tags/$tag points at unexpected object type '$obj_type'"; exit 1 ;;
          esac

          # Prerelease detection from the SemVer core, ignoring build metadata.
          core="${tag#v}"; core="${core%%+*}"
          if [[ "$core" == *-* ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the release tag commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Compute lowercase owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}
          # Explicit release tag + major.minor + an immutable sha-<commit> alias
          # that always identifies the release commit, plus a documented
          # `latest` that only moves for stable (non-prerelease) tags.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=${{ inputs.tag }}
            type=raw,value=sha-${{ steps.ref.outputs.short }}
            type=raw,value=latest,enable=${{ steps.ref.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            PRECOG_BAKE_WEIGHTS=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

      - name: Record the immutable OCI digest
        run: |
          set -euo pipefail
          image="ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}"
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::no OCI digest reported by the build step"
            exit 1
          fi
          echo "OCI digest: ${image}@${digest}"
          {
            echo "### ${GITHUB_WORKFLOW} — ${GITHUB_JOB} (${{ matrix.image }})"
            echo "- release tag: \`${{ steps.ref.outputs.tag }}\`"
            echo "- release commit: \`${{ steps.ref.outputs.sha }}\`"
            echo "- digest: \`${digest}\`"
            echo "- strongest pin: \`${image}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify no model weights are embedded (api)
        if: matrix.name == 'api'
        run: |
          image="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker pull --platform linux/amd64 "$image"
          docker run --rm --platform linux/amd64 --entrypoint sh "$image" -c \
            'count=$(find /opt/precog/hf -name "*.safetensors" 2>/dev/null | wc -l); \
             echo "safetensors in image: $count"; test "$count" -eq 0'

      - name: Verify the published revision matches the release commit
        run: |
          image="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker pull --platform linux/amd64 "$image"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
          echo "OCI revision: $revision"
          test "$revision" = "${{ steps.ref.outputs.sha }}"
