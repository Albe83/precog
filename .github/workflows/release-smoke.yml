name: release-smoke

# Black-box verification of PUBLISHED v1 artifacts.
#
# Nothing here is built from the checkout: the workflow consumes PyPI, GHCR
# images and the published Helm OCI chart. Repository files are used only as
# test orchestration.
#
# The Python scenarios install from PyPI: `precog-client` (SDK train) always,
# and `precog-api`/`precog-mcp` (application train) when
# `verify_application_pypi` is set. Real TimesFM inference is covered by the
# separate integration gate, not here.

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: Application release version (e.g. 1.0.0)
        required: true
        type: string
      python_version:
        description: Published SDK package version (e.g. 0.1.0)
        required: true
        type: string
      app_tag:
        description: Application release tag (default v<app_version>)
        required: false
        type: string
      verify_application_pypi:
        description: Verify published precog-api/precog-mcp from PyPI
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  python-sdk:
    name: python precog-client==${{ inputs.python_version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the published pair in a clean environment
        run: |
          set -euo pipefail
          python -m venv .smoke
          .smoke/bin/pip install --upgrade pip
          .smoke/bin/pip install "precog-client==${{ inputs.python_version }}"
          .smoke/bin/python - <<'PY'
          import pathlib
          import precog_client
          import precog_schemas

          for module in (precog_client, precog_schemas):
              path = pathlib.Path(module.__file__).resolve()
              assert "site-packages" in path.parts, f"not installed from the index: {path}"
              print(module.__name__, path)
          PY

      - name: Public imports, canonical request and CLI
        run: |
          set -euo pipefail
          .smoke/bin/python - <<'PY'
          from precog_client import AsyncPrecogClient, PrecogClient
          from precog_schemas import ForecastRequest

          request = ForecastRequest(
              horizon=3,
              targets=[{"id": "s", "values": [1.0, 2.0, 3.0, 4.0]}],
              quantiles=[0.1, 0.9],
          )
          assert request.horizon == 3
          assert PrecogClient and AsyncPrecogClient
          print(request.model_dump_json())
          PY
          .smoke/bin/precog --help

      - name: Summary
        if: always()
        run: |
          {
            echo "### Python SDK scenario"
            echo "- precog-client version: \`${{ inputs.python_version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  application-pypi:
    if: inputs.verify_application_pypi
    name: python apps precog-api/mcp==${{ inputs.app_version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install published application packages in a clean environment
        run: |
          set -euo pipefail
          python -m venv .app-pypi
          .app-pypi/bin/pip install --upgrade pip
          .app-pypi/bin/pip install \
            "precog-api==${{ inputs.app_version }}" \
            "precog-mcp==${{ inputs.app_version }}"
          for command in precog-api precog-mcp precog-download-model; do
            test -x ".app-pypi/bin/$command" || { echo "missing entry point: $command"; exit 1; }
          done
          .app-pypi/bin/python - <<'PY'
          import importlib.metadata as metadata
          import pathlib

          import precog_api
          import precog_mcp

          expected = "${{ inputs.app_version }}"
          for distribution, module in (("precog-api", precog_api), ("precog-mcp", precog_mcp)):
              assert metadata.version(distribution) == expected
              path = pathlib.Path(module.__file__).resolve()
              assert "site-packages" in path.parts, f"not installed from PyPI/site-packages: {path}"
              files = metadata.distribution(distribution).files or []
              forbidden = [
                  str(file)
                  for file in files
                  if pathlib.PurePosixPath(str(file)).suffix.lower()
                  in {".safetensors", ".gguf", ".pt", ".pth", ".onnx", ".bin"}
              ]
              assert not forbidden, f"model payloads found in {distribution}: {forbidden}"
              print(distribution, expected, path)

          try:
              metadata.version("timesfm")
          except metadata.PackageNotFoundError:
              print("base precog-api install is weight/runtime-light: timesfm is not installed")
          else:
              raise AssertionError("base precog-api unexpectedly installed timesfm; engine must stay optional")
          PY

      - name: Installed API serves canonical contract with fake engine
        run: |
          set -euo pipefail
          PRECOG_ENGINE=fake .app-pypi/bin/precog-api > app-pypi-api.log 2>&1 &
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then cat app-pypi-api.log; exit 1; fi
          curl -fsS http://127.0.0.1:8000/v1/capabilities > app-pypi-caps.json
          curl -fsS -X POST http://127.0.0.1:8000/v1/forecast \
            -H 'content-type: application/json' \
            -d '{"horizon":3,"targets":[{"id":"s","values":[10,11,12,13,14,15]}],"quantiles":[0.1,0.9]}' \
            > app-pypi-forecast.json
          .app-pypi/bin/python - <<'PY'
          import json

          caps = json.load(open("app-pypi-caps.json"))
          assert caps["engine"] == "fake", caps
          result = json.load(open("app-pypi-forecast.json"))
          assert "results" not in result and "mode" not in result, result
          target = result["targets"][0]
          assert len(target["forecast"]) == 3, target
          assert {q["level"] for q in target["quantiles"]} == {0.1, 0.9}, target
          print("PyPI-installed API canonical forecast OK")
          PY

      - name: Installed MCP serves semantic contract against installed API
        run: |
          set -euo pipefail
          PRECOG_API_URL=http://127.0.0.1:8000 \
          PRECOG_MCP_TRANSPORT=http \
          PRECOG_MCP_PORT=8765 \
            .app-pypi/bin/precog-mcp > app-pypi-mcp.log 2>&1 &
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/metrics >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then cat app-pypi-mcp.log; exit 1; fi
          .app-pypi/bin/python deploy/smoke/mcp_smoke.py --url http://127.0.0.1:8765/mcp

      - name: Logs on failure
        if: failure()
        run: |
          cat app-pypi-api.log 2>/dev/null || true
          cat app-pypi-mcp.log 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Application PyPI scenario"
            echo "- precog-api version: ${{ inputs.app_version }}"
            echo "- precog-mcp version: ${{ inputs.app_version }}"
          } >> "$GITHUB_STEP_SUMMARY"

  api-image:
    name: published API image (fake engine)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Resolve the published image digest
        id: image
        run: |
          set -euo pipefail
          tag="${{ inputs.app_tag }}"; [ -n "$tag" ] || tag="v${{ inputs.app_version }}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/${owner}/precog-api:${tag}"
          docker pull "$ref"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Run the published digest with the fake engine
        run: |
          set -euo pipefail
          docker run -d --name precog-api -e PRECOG_ENGINE=fake -p 18000:8000 \
            "${{ steps.image.outputs.digest }}"
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18000/readyz >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = "true"
          curl -fsS http://127.0.0.1:18000/readyz
          curl -fsS http://127.0.0.1:18000/v1/capabilities > caps.json
          curl -fsS -X POST http://127.0.0.1:18000/v1/forecast \
            -H 'content-type: application/json' \
            -d '{"horizon":3,"targets":[{"id":"s","values":[10,11,12,13,14,15]}],"quantiles":[0.1,0.9]}' \
            > forecast.json
          python3 - <<'PY'
          import json

          caps = json.load(open("caps.json"))
          assert caps["engine"] == "fake", caps
          assert "limits" in caps and "quantile_levels" in caps, caps

          result = json.load(open("forecast.json"))
          assert "results" not in result and "mode" not in result, result
          target = result["targets"][0]
          assert len(target["forecast"]) == 3, target
          assert {q["level"] for q in target["quantiles"]} == {0.1, 0.9}, target
          print("canonical REST forecast OK:", target["forecast"])
          PY

      - name: API logs on failure
        if: failure()
        run: docker logs precog-api || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Published API image"
            echo "- tag: \`${{ steps.image.outputs.tag }}\`"
            echo "- digest: \`${{ steps.image.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  mcp-image:
    name: published MCP image against published API
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ steps.images.outputs.api_digest }}
      mcp_digest: ${{ steps.images.outputs.mcp_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the published image digests
        id: images
        run: |
          set -euo pipefail
          tag="${{ inputs.app_tag }}"; [ -n "$tag" ] || tag="v${{ inputs.app_version }}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          api_ref="ghcr.io/${owner}/precog-api:${tag}"
          mcp_ref="ghcr.io/${owner}/precog-mcp:${tag}"
          docker pull "$api_ref"
          docker pull "$mcp_ref"
          api_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$api_ref")"
          mcp_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$mcp_ref")"
          {
            echo "api_digest=$api_digest"
            echo "mcp_digest=$mcp_digest"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Start the published API and MCP images
        run: |
          set -euo pipefail
          docker network create precog-smoke
          docker run -d --name precog-api --network precog-smoke -e PRECOG_ENGINE=fake \
            "${{ steps.images.outputs.api_digest }}"
          docker run -d --name precog-mcp --network precog-smoke -p 18765:8765 \
            -e PRECOG_API_URL=http://precog-api:8000 \
            -e PRECOG_MCP_TRANSPORT=http \
            -e PRECOG_MCP_PORT=8765 \
            "${{ steps.images.outputs.mcp_digest }}"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18765/metrics >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18765/metrics >/dev/null

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generic MCP client smoke (tools, resource, forecast)
        run: |
          set -euo pipefail
          python -m venv .mcpclient
          .mcpclient/bin/pip install "mcp>=2.2"
          .mcpclient/bin/python deploy/smoke/mcp_smoke.py --url http://127.0.0.1:18765/mcp

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs precog-api || true
          docker logs precog-mcp || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Published MCP image"
            echo "- API digest: \`${{ steps.images.outputs.api_digest }}\`"
            echo "- MCP digest: \`${{ steps.images.outputs.mcp_digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  helm-chart:
    name: published Helm OCI chart on kind
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.chart.outputs.chart_version }}
    steps:
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: precog-smoke

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Install the published chart with the fake engine
        id: chart
        run: |
          set -euo pipefail
          tag="${{ inputs.app_tag }}"; [ -n "$tag" ] || tag="v${{ inputs.app_version }}"
          version="${{ inputs.app_version }}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "chart_version=$version" >> "$GITHUB_OUTPUT"
          kubectl create namespace precog
          helm install precog "oci://ghcr.io/${owner}/precog-charts/precog" \
            --version "$version" \
            --namespace precog \
            --set "image.repository=ghcr.io/${owner}/precog-api" \
            --set "image.tag=$tag" \
            --set "mcp.enabled=true" \
            --set "mcp.image.repository=ghcr.io/${owner}/precog-mcp" \
            --set "mcp.image.tag=$tag" \
            --set "mcp.service.enabled=true" \
            --set "mcp.allowedHosts=*" \
            --set config.engine=fake \
            --wait --timeout 5m

      - name: Canonical forecast through the released chart
        run: |
          set -euo pipefail
          kubectl -n precog port-forward svc/precog 18080:80 >/dev/null 2>&1 &
          forward=$!
          trap 'kill "$forward" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/readyz >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = "true"
          curl -fsS http://127.0.0.1:18080/v1/capabilities > caps.json
          curl -fsS -X POST http://127.0.0.1:18080/v1/forecast \
            -H 'content-type: application/json' \
            -d '{"horizon":3,"targets":[{"id":"s","values":[10,11,12,13,14,15]}],"quantiles":[0.1,0.9]}' \
            > forecast.json
          python3 - <<'PY'
          import json

          caps = json.load(open("caps.json"))
          assert caps["engine"] == "fake", caps
          result = json.load(open("forecast.json"))
          assert "results" not in result and "mode" not in result, result
          assert len(result["targets"][0]["forecast"]) == 3, result
          print("chart REST forecast OK")
          PY

      - name: Helm test
        run: helm test precog -n precog --timeout 2m

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n precog get pods
          kubectl -n precog describe pods || true
          kubectl -n precog logs -l app.kubernetes.io/name=precog --all-containers --tail=100 || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Published Helm chart"
            echo "- app version: \`${{ inputs.app_version }}\`"
            echo "- app tag: \`${{ steps.chart.outputs.tag }}\`"
            echo "- chart version: \`${{ steps.chart.outputs.chart_version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: smoke summary
    runs-on: ubuntu-latest
    needs: [python-sdk, application-pypi, api-image, mcp-image, helm-chart]
    if: always()
    steps:
      - name: Report versions and digests under test
        run: |
          {
            echo "## External artifact smoke"
            echo
            echo "| Artifact | Version / digest | Result |"
            echo "| --- | --- | --- |"
            echo "| Python SDK | precog-client==${{ inputs.python_version }} | ${{ needs.python-sdk.result }} |"
            echo "| API/MCP PyPI | precog-api/mcp==${{ inputs.app_version }} | ${{ needs.application-pypi.result }} |"
            echo "| API image | ${{ needs.api-image.outputs.digest }} | ${{ needs.api-image.result }} |"
            echo "| MCP image | ${{ needs.mcp-image.outputs.mcp_digest }} | ${{ needs.mcp-image.result }} |"
            echo "| Helm chart | ${{ needs.helm-chart.outputs.chart_version }} | ${{ needs.helm-chart.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::at least one external-artifact scenario failed"
            exit 1
          fi
