name: autorelease

# Automates patch/minor release PRs: approves the pending workflow runs that
# GitHub holds for the bot-created release PR, waits for the required checks and
# merges it (squash). No manual approval needed.
#
# Two things this workflow deliberately does NOT do:
#
#   1. It never auto-merges a release PR that crosses a major-version boundary
#      (previous manifest major != release PR target major). The PR is left open
#      for explicit review. To finalize a major release, review and merge the
#      release PR manually; see the "Major releases" section of CONTRIBUTING.md.
#   2. It does not rely on an unrelated later push to finalize the release. When
#      the merge uses the fallback `GITHUB_TOKEN` (no `RELEASE_PLEASE_TOKEN`
#      secret), the merge push does not trigger `push` workflows, so this
#      workflow explicitly dispatches `release-please.yml` on main. With a real
#      PAT the merge push already triggers `release-please`, so no dispatch is
#      made (no duplicate/racing finalization).

on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

# Only one controller may actively process release PRs. A newer run queues
# instead of racing (and never cancels a run that is mid-decision).
concurrency:
  group: autorelease
  cancel-in-progress: false

jobs:
  merge-release-pr:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      HAS_RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - name: Approve pending checks and merge the release PR
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          pr=$(gh pr list --repo "$repo" --state open --json number,headRefName \
                --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number // empty')
          if [ -z "$pr" ]; then echo "no release PR open"; exit 0; fi
          branch=$(gh pr view "$pr" --repo "$repo" --json headRefName --jq .headRefName)
          state=$(gh pr view "$pr" --repo "$repo" --json state --jq .state)
          echo "release PR #$pr on $branch (state: $state)"

          if [ "$state" = "MERGED" ]; then
            echo "release PR #$pr was already merged; nothing to do"
            { echo "## Release PR already merged"; echo "PR #$pr is merged; skipping merge/dispatch."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$state" != "OPEN" ]; then
            echo "::notice::release PR #$pr is $state (not open); nothing to do"
            { echo "## Release PR $state"; echo "PR #$pr is no longer open; not merging."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          read_manifest_version() {
            gh api "repos/$repo/contents/.release-please-manifest.json?ref=$1" --jq .content \
              | base64 -d \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["."])'
          }

          current="$(read_manifest_version main)"
          target="$(read_manifest_version "$branch")"
          current_major="${current%%.*}"
          target_major="${target%%.*}"
          echo "manifest on main: $current; release PR target: $target"

          if [ "$target_major" != "$current_major" ]; then
            echo "::notice::release PR #$pr crosses a major boundary ($current -> $target); leaving it open for manual review and merge"
            {
              echo "## Major release requires manual merge"
              echo
              echo "Release PR #$pr would move \`$current\` -> \`$target\` (major boundary)."
              echo "Autorelease will not merge it. Review the version/changelog and merge it manually;"
              echo "then finalize with \`gh workflow run release-please.yml --ref main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for id in $(gh run list --repo "$repo" --branch "$branch" --status action_required \
                       --limit 50 --json databaseId --jq '.[].databaseId'); do
            echo "approving run $id"
            gh api -X POST "repos/$repo/actions/runs/$id/approve" || echo "approve failed (a PAT may be required)"
          done

          for _ in $(seq 1 90); do
            state=$(gh pr view "$pr" --repo "$repo" --json state --jq .state)
            if [ "$state" = "MERGED" ]; then
              echo "release PR #$pr was merged by another actor/run; nothing left to do"
              { echo "## Release PR already merged"; echo "PR #$pr was merged concurrently; skipping merge/dispatch."; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$state" != "OPEN" ]; then
              echo "::notice::release PR #$pr became $state before merge; exiting without merging"
              { echo "## Release PR $state"; echo "PR #$pr is $state (closed without merge); not merging."; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            mstate=$(gh pr view "$pr" --repo "$repo" --json mergeStateStatus --jq .mergeStateStatus)
            echo "merge state: $mstate"
            [ "$mstate" = "CLEAN" ] && break
            sleep 20
          done

          state=$(gh pr view "$pr" --repo "$repo" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "release PR #$pr is $state; exiting without merging"
            exit 0
          fi
          mstate=$(gh pr view "$pr" --repo "$repo" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$mstate" != "CLEAN" ]; then
            echo "::error::release PR #$pr did not reach a mergeable state (last: $mstate); refusing to merge blindly"
            exit 1
          fi
          if ! gh pr merge "$pr" --repo "$repo" --squash --delete-branch; then
            if [ "$(gh pr view "$pr" --repo "$repo" --json state --jq .state)" = "MERGED" ]; then
              echo "release PR #$pr was merged concurrently; continuing"
            else
              echo "::error::failed to merge release PR #$pr"
              exit 1
            fi
          fi

          if [ "$HAS_RELEASE_PLEASE_TOKEN" = "true" ]; then
            echo "RELEASE_PLEASE_TOKEN set: the merge push already triggers release-please; not dispatching"
          else
            echo "fallback GITHUB_TOKEN: dispatching release-please finalization on main"
            gh workflow run release-please.yml --repo "$repo" --ref main
          fi
