name: release-please

# Runs release-please on main: it opens/updates the release PR and, once the
# release PR has been merged (and the manifest/tag state is consistent),
# creates the GitHub release and its tag.
#
# It is also explicitly dispatchable so that a release merged with the fallback
# `GITHUB_TOKEN` (which does not trigger `push` workflows) can be finalized
# deterministically: `autorelease` dispatches this workflow after such a merge.
# Re-running it is idempotent (an existing release is not recreated).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      finalize:
        description: Finalize an already-merged release if needed (idempotent)
        required: false
        type: boolean
        default: true
      dispatch_pypi_tag:
        description: Re-dispatch the application PyPI publisher for this tag (e.g. v1.0.0)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# Serialize runs so a dispatch cannot race the push-triggered run.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # With a fine-grained PAT the release PR runs its checks without the
          # manual approval gate; otherwise fall back to the default token and
          # let the `autorelease` workflow approve the runs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release created with the default GITHUB_TOKEN does not trigger the
  # `release` event, so publish the images from here when a release is cut.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Package and publish the Helm chart (OCI + release asset) for the release.
  chart:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-chart.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Publish the application Python distributions (precog-api, precog-mcp) to
  # PyPI. PyPI Trusted Publishing does not support reusable workflows, so this
  # dispatches the standalone `publish-python-apps.yml` via the workflow-dispatch
  # API (GitHub allows a GITHUB_TOKEN-triggered run to create another dispatch
  # run). Opt-in via the repository variable PYPI_APP_PUBLISH so pre-v1 releases
  # do not attempt to upload projects whose Trusted Publishers may not exist
  # yet; enable it for the deliberate v1.0.0 release.
  #
  # `dispatch_pypi_tag` is an operator/test escape hatch: it re-dispatches the
  # publisher for a concrete tag without cutting a release. The publisher still
  # validates the tag, so it cannot upload from unreleased `main`.
  pypi:
    needs: release-please
    if: >-
      (needs.release-please.outputs.release_created == 'true' && vars.PYPI_APP_PUBLISH == 'true')
      || inputs.dispatch_pypi_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.dispatch_pypi_tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Dispatch the standalone application publisher and wait for it
        run: |
          set -euo pipefail
          tag="$TAG"
          if [ -z "$tag" ]; then
            echo "::error::no release tag to publish"
            exit 1
          fi
          echo "dispatching publish-python-apps.yml at ref $tag"
          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-python-apps.yml \
                     --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run publish-python-apps.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$tag" -f "tag=$tag"
          run_id=""
          for _ in $(seq 1 24); do
            newest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-python-apps.yml \
                       --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$newest" != "$before" ] && [ "$newest" != "0" ]; then run_id="$newest"; break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::could not find the dispatched publish-python-apps run"
            exit 1
          fi
          url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          echo "child run: $url"
          {
            echo "### Application PyPI publication"
            echo "- release tag: \`$tag\`"
            echo "- dispatched run: $url"
          } >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
