name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: precog-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build MCP image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.mcp
          push: false
          load: true
          tags: precog-mcp:ci
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

      - name: Report image sizes
        run: |
          for image in precog-api:ci precog-mcp:ci; do
            bytes=$(docker image inspect "$image" --format '{{.Size}}')
            echo "$image size: $((bytes / 1024 / 1024)) MiB"
          done

      - name: Verify MCP image entrypoint and weight-free runtime
        run: |
          docker run --rm --entrypoint python precog-mcp:ci -c \
            'import importlib.util; import precog_client, precog_mcp, precog_schemas; \
             assert importlib.util.find_spec("torch") is None, "torch must not be in the MCP image"; \
             print("precog-mcp imports OK; no torch/TimesFM runtime")'

      - name: Scan API image (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: precog-api:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan MCP image (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: precog-mcp:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
