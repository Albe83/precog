name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: precog-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          bytes=$(docker image inspect precog-api:ci --format '{{.Size}}')
          echo "image size: $((bytes / 1024 / 1024)) MiB"

      - name: Scan image (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: precog-api:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
