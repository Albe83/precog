name: helm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.31.4

      - name: helm lint
        run: helm lint deploy/helm/precog

      - name: helm template (variants)
        run: |
          set -euo pipefail
          chart=deploy/helm/precog
          helm template precog "$chart" >/dev/null
          helm template precog "$chart" --set modelCache.persistence.enabled=true >/dev/null
          helm template precog "$chart" \
            --set modelCache.persistence.enabled=true \
            --set modelCache.downloadJob.enabled=true >/dev/null
          helm template precog "$chart" --set modelCache.downloadInitContainer.enabled=true >/dev/null
          helm template precog "$chart" \
            --set mcp.enabled=true \
            --set mcp.allowedHosts="precog-mcp.precog.svc:80" >/dev/null
          helm template precog "$chart" \
            --set config.apiKey=secret \
            --set autoscaling.enabled=true \
            --set modelCache.persistence.enabled=true \
            --set podDisruptionBudget.enabled=true >/dev/null
          helm template precog "$chart" --set modelCache.persistence.existingClaim=my-cache >/dev/null
          helm template precog "$chart" --set metrics.serviceMonitor.enabled=true >/dev/null
          helm template precog "$chart" --set config.existingSecret=my-secret >/dev/null
          helm template precog "$chart" \
            --set extraEnv[0].name=SSL_CERT_FILE \
            --set extraEnv[0].value=/etc/ssl/certs/corp-ca.crt \
            --set extraVolumes[0].name=corp-ca \
            --set extraVolumes[0].secret.secretName=corp-ca \
            --set extraVolumeMounts[0].name=corp-ca \
            --set extraVolumeMounts[0].mountPath=/etc/ssl/certs/corp-ca.crt >/dev/null
          helm template precog "$chart" \
            --set imagePullSecrets[0].name=regcred \
            --set podLabels.team=ml \
            --set priorityClassName=high \
            --set nodeSelector.disktype=ssd \
            --set service.annotations.foo=bar \
            --set topologySpreadConstraints[0].maxSkew=1 \
            --set topologySpreadConstraints[0].topologyKey=kubernetes.io/hostname \
            --set topologySpreadConstraints[0].whenUnsatisfiable=ScheduleAnyway \
            --set mcp.enabled=true >/dev/null
          helm template precog "$chart" \
            --set networkPolicy.enabled=true \
            --set networkPolicy.mcp.ingress[0].from[0].podSelector.matchLabels.app\.kubernetes\.io/name=agentgateway \
            --set networkPolicy.api.ingress[0].from[0].podSelector.matchLabels.app\.kubernetes\.io/name=precog-mcp \
            --set mcp.enabled=true >/dev/null
          helm template precog "$chart" \
            --set httpRoute.enabled=true \
            --set httpRoute.parentRefs[0].name=private-corporate \
            --set httpRoute.parentRefs[0].namespace=gateway-system \
            --set httpRoute.api.enabled=true \
            --set mcp.enabled=true >/dev/null

      - name: guard (httpRoute requires parentRefs)
        run: |
          set -euo pipefail
          if helm template precog deploy/helm/precog --set httpRoute.enabled=true >/dev/null 2>&1; then
            echo "::error::expected helm template to fail for httpRoute without parentRefs"
            exit 1
          fi

      - name: guard (downloadJob requires a persistent cache)
        run: |
          set -euo pipefail
          if helm template precog deploy/helm/precog --set modelCache.downloadJob.enabled=true >/dev/null 2>&1; then
            echo "::error::expected helm template to fail when downloadJob is enabled without persistence"
            exit 1
          fi

      - name: guard (HPA requires a shared cache)
        run: |
          set -euo pipefail
          if helm template precog deploy/helm/precog --set autoscaling.enabled=true >/dev/null 2>&1; then
            echo "::error::expected helm template to fail for HPA without a shared model cache"
            exit 1
          fi

      - name: guard (apiKey and existingSecret are mutually exclusive)
        run: |
          set -euo pipefail
          if helm template precog deploy/helm/precog --set config.apiKey=x --set config.existingSecret=y >/dev/null 2>&1; then
            echo "::error::expected helm template to fail when both apiKey and existingSecret are set"
            exit 1
          fi

      - name: kustomize build
        run: |
          set -euo pipefail
          kubectl kustomize deploy/kustomize/base >/dev/null
          kubectl kustomize deploy/kustomize/overlays/dev >/dev/null
          kubectl kustomize deploy/kustomize/overlays/prod >/dev/null
