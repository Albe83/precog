name: publish-chart

# Packages the Helm chart and publishes it so it can be pinned by version:
#   - OCI: oci://ghcr.io/<owner>/precog-charts/precog --version <x.y.z>
#   - GitHub release asset: precog-<x.y.z>.tgz
#
# The archive is always built from the concrete release tag supplied as
# `inputs.tag`, never from the workflow event SHA. Manual dispatch must name an
# existing release tag.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to package (e.g. v1.0.0). Chart version is tag minus "v".
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-chart-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate the release tag
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            echo "::error::a concrete release tag is required; manual dispatch republishes an existing release, it does not package unreleased main"
            exit 1
          fi

          # Must be a v-prefixed SemVer release tag. Reject branches (main),
          # raw commit SHAs and malformed refs before packaging/publishing.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' is not a SemVer release tag (expected vMAJOR.MINOR.PATCH[-prerelease][+build]); branches, commit SHAs and arbitrary refs are rejected"
            exit 1
          fi

          # Prove refs/tags/<tag> exists (not merely that the name resolves to a
          # commit) and resolve it, dereferencing annotated tags.
          if ! ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>/dev/null)"; then
            echo "::error::release tag 'refs/tags/$tag' does not exist in ${GITHUB_REPOSITORY}"
            exit 1
          fi
          obj_type="$(jq -r .object.type <<<"$ref")"
          obj_sha="$(jq -r .object.sha <<<"$ref")"
          case "$obj_type" in
            tag) sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${obj_sha}" --jq .object.sha)" ;;
            commit) sha="$obj_sha" ;;
            *) echo "::error::refs/tags/$tag points at unexpected object type '$obj_type'"; exit 1 ;;
          esac

          # Chart version is the SemVer value without the leading "v".
          version="${tag#v}"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### publish-chart"
            echo "- release tag: \`$tag\`"
            echo "- release commit: \`$sha\`"
            echo "- chart version: \`$version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the release tag commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Package chart from the release tag
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package deploy/helm/precog \
            --version "${{ steps.ref.outputs.version }}" \
            --app-version "${{ steps.ref.outputs.version }}" \
            -d dist
          ls -l dist

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR (OCI)
        run: helm push dist/precog-*.tgz oci://ghcr.io/${{ steps.ref.outputs.owner }}/precog-charts

      - name: Attach chart to the GitHub release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/precog-*.tgz --clobber
