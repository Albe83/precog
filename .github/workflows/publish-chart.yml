name: publish-chart

# Packages the Helm chart and publishes it so it can be pinned by version:
#   - OCI: oci://ghcr.io/<owner>/precog-charts/precog --version <x.y.z>
#   - GitHub release asset: precog-<x.y.z>.tgz

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to package (e.g. v0.5.0). Chart version is tag minus "v".
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (optional)
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Compute owner and version
        id: vars
        run: |
          set -euo pipefail
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          tag="${{ inputs.tag }}"
          version="${tag#v}"
          if [ -z "$version" ]; then version="0.0.0-dev"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package deploy/helm/precog \
            --version "${{ steps.vars.outputs.version }}" \
            --app-version "${{ steps.vars.outputs.version }}" \
            -d dist
          ls -l dist

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR (OCI)
        run: helm push dist/precog-*.tgz oci://ghcr.io/${{ steps.vars.outputs.owner }}/precog-charts

      - name: Attach chart to the GitHub release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/precog-*.tgz --clobber
